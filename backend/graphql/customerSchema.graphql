type User {
  id: ID!
  name: String!
  dateOfBirth: String!
  email: String!
}

type Query {
  me: User
  login(email: String!, password: String!): AuthPayload!
  user(id: ID!): User!
}

type Mutation {
  createUser(name: String!, dateOfBirth: String!, email: String!): User!
  signup(name: String!, email: String!, password: String!, dateOfBirth: String!): AuthPayload!
  createApplication: ApplicationPayload!
  submitCollectIncomeScreen(input: CollectIncomeApplicationInput!): ApplicationPayload!
  submitEssentialExpenseScreen(input: ExpenseApplicationInput!): ApplicationPayload!
}

type AuthPayload {
  token: String!
  user: User!
}

enum ApplicationScreen {
  IncomeDetailScreen
  EssentialExpenseScreen
  FinancialLoanExpenseScreen
  CompletedScreen
}

enum ExpenseSource {
  ESSENTIALS
  FINANCIAL_LOAN
}

type ApplicationPayload {
  screen: ApplicationScreen
}

input ExpenseItemsInput {
  name: String!
  amount: Int!
  source: ExpenseSource!
}

input CollectIncomeApplicationInput {
  applicationId: ID!
  incomeAmount: Int!
}

input ExpenseApplicationInput {
  applicationId: ID!
  items: [ExpenseItemsInput!]!
}