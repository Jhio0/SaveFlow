mutation SubmitExpenseScreen($input: ExpenseApplicationInput!) {
  submitExpenseScreen(input: $input) {
    __typename

    ... on EssentialExpensePayload {
      screen
    }

    ... on FinancialLoanExpensePayload {
      screen
    }

    ... on SubscriptionExpensePayload {
      screen
    }

    ... on InformationReviewPayload {
      screen
      essentialItems {
        name
        amount
        source
      }
      financialLoanItems {
        name
        amount
        source
      }
      subscriptionItems {
        name
        amount
        source
      }
    }
  }
}
